<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GroundSense AI · Print Stations</title>
<style>
body{font-family:Arial,sans-serif;margin:0;color:#111}main{max-width:900px;margin:auto;padding:22px}.controls{margin-bottom:18px}.station{border:3px solid #111;border-radius:18px;padding:28px;margin:0 0 24px;min-height:420px;display:flex;flex-direction:column;justify-content:space-between;page-break-after:always}.num{font-size:14px;font-weight:bold;letter-spacing:.15em}.role{font-size:28px;font-weight:bold;margin-top:18px}.quote{font-size:36px;line-height:1.18;font-weight:800;margin:28px 0}.code{font-size:18px}.code strong{font-size:54px;letter-spacing:.12em;display:block;margin-top:8px}.final{border-style:dashed}.hide-note{background:#eee;padding:10px 12px;border-radius:8px;font-weight:bold}@media print{.controls{display:none}main{max-width:none;padding:0}.station{border-radius:0;margin:0;padding:18mm;min-height:250mm}}
</style>
</head>
<body><main>
<div class="controls"><button onclick="window.print()">Print stations</button> <span>Print 2 copies of each for larger rooms.</span></div>
<div id="cards"></div>
</main>
<script>
const stations=[
["01","Resident — older adult","“Activities are always on Saturday. That is when I visit my grandchildren.”","3814"],
["02","Resident — first-time participant","“I came once. Everyone already seemed to know each other, so I left quite early.”","5729"],
["03","Youth resident","“The activities are not really for people my age. I usually just play basketball downstairs.”","1468"],
["04","Parent","“I would come more often if there was something my children could take part in too.”","9035"],
["05","Potential volunteer","“I do not mind helping. I have just never really been asked directly.”","6241"],
["06","Community asset","“A resident has offered to teach simple home cooking if there is interest.”","7153"],
["07","Programme history","“Smaller interest-based activities have had better repeat attendance than large one-off events.”","4386"],
["08","Resident concern","“Evening activities downstairs can get noisy. Some residents have complained before.”","2897"]
];
const root=document.getElementById("cards");
root.innerHTML=stations.map(s=>`<section class="station"><div><div class="num">GROUND STATION ${s[0]}</div><div class="role">${s[1]}</div><div class="quote">${s[2]}</div></div><div class="code">Return to your table and enter this code:<strong>${s[3]}</strong></div></section>`).join("")+
`<section class="station final"><div><div class="num">FINAL GROUND UPDATE · HUMAN CONTEXT</div><div class="hide-note">KEEP COVERED UNTIL THE FACILITATOR SAYS “HUMAN CONTEXT”</div><div class="quote">The resident who offered to teach cooking recently lost her husband. She did not volunteer because she wants to “run a programme”. She said she misses having people around and wants something meaningful to contribute.</div></div><div class="code">Return to your table and tell them what you learned. Do not photograph this card.</div></section>`;
</script>
</body></html>
